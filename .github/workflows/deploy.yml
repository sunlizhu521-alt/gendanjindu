name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beihuochuhuojihua
        uses: actions/checkout@v4
        with:
          repository: sunlizhu521-alt/beihuochuhuojihua
          ref: main

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='dist' \
            -czf "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" .

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload package
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /home/ubuntu/zhuge-ai-lab/beihuochuhuojihua /tmp/beihuochuhuojihua-deploy"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz

      - name: Deploy and verify
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -Eeuo pipefail

            APP_DIR=/home/ubuntu/zhuge-ai-lab/beihuochuhuojihua
            ARCHIVE=/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz
            BACKUP_DIR=/home/ubuntu/backups/beihuochuhuojihua
            APP_NAME=beihuochuhuojihua
            APP_PORT=4009

            mkdir -p "$APP_DIR" "$BACKUP_DIR"

            if ! pm2 describe "$APP_NAME" >/dev/null 2>&1 \
              && lsof -t -iTCP:"$APP_PORT" -sTCP:LISTEN >/dev/null 2>&1; then
              echo "Port $APP_PORT is occupied by another service; deployment stopped without changing it."
              exit 1
            fi

            if [ -s "$APP_DIR/data/gendanjindu.sqlite" ]; then
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="$BACKUP_DIR/gendanjindu-$TIMESTAMP.sqlite.gz"
              gzip -c "$APP_DIR/data/gendanjindu.sqlite" > "$BACKUP_FILE.tmp"
              gzip -t "$BACKUP_FILE.tmp"
              mv "$BACKUP_FILE.tmp" "$BACKUP_FILE"
              ls -lh "$BACKUP_FILE"
            fi

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            cd "$APP_DIR"
            npm ci
            export VITE_API_BASE_URL=/beihuochuhuojihua-api
            npm run build

            export PORT="$APP_PORT"
            export DATA_DIR="$APP_DIR/data"
            pm2 startOrRestart ecosystem.config.cjs --only "$APP_NAME" --update-env

            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$APP_PORT/api/bootstrap" >/dev/null \
                && curl -fsS "http://127.0.0.1:$APP_PORT/beihuochuhuojihua/" >/dev/null; then
                break
              fi
              if [ "$attempt" = 30 ]; then
                pm2 logs "$APP_NAME" --lines 100 --nostream
                exit 1
              fi
              sleep 2
            done

            pm2 save
            pm2 describe "$APP_NAME"

            NGINX_CONFIG=/etc/nginx/conf.d/beihuochuhuojihua.conf
            NGINX_BACKUP=
            if [ -f "$NGINX_CONFIG" ]; then
              NGINX_BACKUP="$BACKUP_DIR/nginx-$(date +%Y%m%d-%H%M%S).conf"
              sudo -n cp "$NGINX_CONFIG" "$NGINX_BACKUP"
            fi
            sudo -n tee "$NGINX_CONFIG.new" >/dev/null <<'NGINX'
          server {
              listen 80;
              server_name 129.211.9.242;
              client_max_body_size 100m;

              location /beihuochuhuojihua-api/ {
                  proxy_pass http://127.0.0.1:4009/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
              }

              location /beihuochuhuojihua/ {
                  proxy_pass http://127.0.0.1:4009;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
              }

              location / {
                  proxy_pass http://127.0.0.1:4003;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX
            sudo -n mv "$NGINX_CONFIG.new" "$NGINX_CONFIG"
            if ! sudo -n nginx -t; then
              if [ -n "$NGINX_BACKUP" ]; then
                sudo -n cp "$NGINX_BACKUP" "$NGINX_CONFIG"
              else
                sudo -n rm -f "$NGINX_CONFIG"
              fi
              sudo -n nginx -t
              exit 1
            fi
            sudo -n systemctl reload nginx
            curl -fsS -H 'Host: 129.211.9.242' http://127.0.0.1/beihuochuhuojihua-api/api/bootstrap >/dev/null
            curl -fsS -H 'Host: 129.211.9.242' http://127.0.0.1/beihuochuhuojihua/ >/dev/null
            curl -fsS -H 'Host: 129.211.9.242' http://127.0.0.1/ >/dev/null
            certbot --version || true
            sudo -n certbot certificates || true
            sudo -n ss -ltnp | grep ':443 ' || true
            sudo -n systemctl is-enabled certbot.timer || true
            sudo -n systemctl is-active certbot.timer || true
            sudo -n nginx -T 2>/dev/null | grep -E 'listen 443|ssl_certificate' || true
            rm -f "$ARCHIVE"
          EOF
