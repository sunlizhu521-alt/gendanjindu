name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beihuochuhuojihua
        uses: actions/checkout@v4
        with:
          repository: sunlizhu521-alt/beihuochuhuojihua
          ref: main

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='dist' \
            -czf "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" .

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload package
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /home/ubuntu/zhuge-ai-lab/beihuochuhuojihua /tmp/beihuochuhuojihua-deploy"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz

      - name: Deploy and verify
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -Eeuo pipefail

            APP_DIR=/home/ubuntu/zhuge-ai-lab/beihuochuhuojihua
            ARCHIVE=/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz
            BACKUP_DIR=/home/ubuntu/backups/beihuochuhuojihua
            APP_NAME=beihuochuhuojihua
            APP_PORT=4009

            mkdir -p "$APP_DIR" "$BACKUP_DIR"

            if ! pm2 describe "$APP_NAME" >/dev/null 2>&1 \
              && lsof -t -iTCP:"$APP_PORT" -sTCP:LISTEN >/dev/null 2>&1; then
              echo "Port $APP_PORT is occupied by another service; deployment stopped without changing it."
              exit 1
            fi

            if [ -s "$APP_DIR/data/gendanjindu.sqlite" ]; then
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="$BACKUP_DIR/gendanjindu-$TIMESTAMP.sqlite.gz"
              gzip -c "$APP_DIR/data/gendanjindu.sqlite" > "$BACKUP_FILE.tmp"
              gzip -t "$BACKUP_FILE.tmp"
              mv "$BACKUP_FILE.tmp" "$BACKUP_FILE"
              ls -lh "$BACKUP_FILE"
            fi

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            cd "$APP_DIR"
            npm ci
            export VITE_API_BASE_URL=/beihuochuhuojihua-api
            npm run build

            export PORT="$APP_PORT"
            export DATA_DIR="$APP_DIR/data"
            pm2 startOrRestart ecosystem.config.cjs --only "$APP_NAME" --update-env

            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$APP_PORT/api/bootstrap" >/dev/null \
                && curl -fsS "http://127.0.0.1:$APP_PORT/beihuochuhuojihua/" >/dev/null; then
                break
              fi
              if [ "$attempt" = 30 ]; then
                pm2 logs "$APP_NAME" --lines 100 --nostream
                exit 1
              fi
              sleep 2
            done

            pm2 save
            pm2 describe "$APP_NAME"

            NGINX_CONFIG=/etc/nginx/conf.d/beihuochuhuojihua.conf
            NGINX_BACKUP=
            ACME_WEBROOT=/var/www/letsencrypt
            if [ -f "$NGINX_CONFIG" ]; then
              NGINX_BACKUP="$BACKUP_DIR/nginx-$(date +%Y%m%d-%H%M%S).conf"
              sudo -n cp "$NGINX_CONFIG" "$NGINX_BACKUP"
            fi
            sudo -n mkdir -p "$ACME_WEBROOT/.well-known/acme-challenge"
            sudo -n tee "$NGINX_CONFIG.new" >/dev/null <<'NGINX_HTTP'
          server {
              listen 80;
              server_name 129.211.9.242;
              client_max_body_size 100m;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/letsencrypt;
              }

              location /beihuochuhuojihua-api/ {
                  proxy_pass http://127.0.0.1:4009/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
              }

              location /beihuochuhuojihua/ {
                  proxy_pass http://127.0.0.1:4009;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
              }

              location / {
                  proxy_pass http://127.0.0.1:4003;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX_HTTP
            sudo -n mv "$NGINX_CONFIG.new" "$NGINX_CONFIG"
            if ! sudo -n nginx -t; then
              if [ -n "$NGINX_BACKUP" ]; then
                sudo -n cp "$NGINX_BACKUP" "$NGINX_CONFIG"
              else
                sudo -n rm -f "$NGINX_CONFIG"
              fi
              sudo -n nginx -t
              exit 1
            fi
            sudo -n systemctl reload nginx

            if ! command -v snap >/dev/null 2>&1; then
              echo "snap is unavailable; HTTPS setup stopped without replacing the working HTTP proxy."
              exit 1
            fi
            sudo -n snap install certbot --classic || sudo -n snap refresh certbot
            CERTBOT_VERSION=$(/snap/bin/certbot --version | awk '{print $2}')
            if [ "$(printf '%s\n' 5.4 "$CERTBOT_VERSION" | sort -V | head -n 1)" != 5.4 ]; then
              echo "Certbot $CERTBOT_VERSION is too old for IP webroot certificates."
              exit 1
            fi
            sudo -n /snap/bin/certbot certonly \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --preferred-profile shortlived \
              --webroot \
              --webroot-path "$ACME_WEBROOT" \
              --ip-address 129.211.9.242 \
              --cert-name 129.211.9.242 \
              --keep-until-expiring

            sudo -n tee "$NGINX_CONFIG.new" >/dev/null <<'NGINX_HTTPS'
          server {
              listen 80;
              server_name 129.211.9.242;
              client_max_body_size 100m;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/letsencrypt;
              }

              location = /beihuochuhuojihua {
                  return 308 https://$host/beihuochuhuojihua/;
              }

              location /beihuochuhuojihua/ {
                  return 308 https://$host$request_uri;
              }

              location /beihuochuhuojihua-api/ {
                  return 308 https://$host$request_uri;
              }

              location / {
                  proxy_pass http://127.0.0.1:4003;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

          server {
              listen 443 ssl;
              server_name 129.211.9.242;
              client_max_body_size 100m;

              ssl_certificate /etc/letsencrypt/live/129.211.9.242/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/129.211.9.242/privkey.pem;

              location /beihuochuhuojihua-api/ {
                  proxy_pass http://127.0.0.1:4009/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
              }

              location /beihuochuhuojihua/ {
                  proxy_pass http://127.0.0.1:4009;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
              }

              location / {
                  proxy_pass http://127.0.0.1:4003;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX_HTTPS
            sudo -n mv "$NGINX_CONFIG.new" "$NGINX_CONFIG"
            if ! sudo -n nginx -t; then
              if [ -n "$NGINX_BACKUP" ]; then
                sudo -n cp "$NGINX_BACKUP" "$NGINX_CONFIG"
              fi
              sudo -n nginx -t
              exit 1
            fi
            sudo -n systemctl reload nginx

            sudo -n mkdir -p /etc/letsencrypt/renewal-hooks/deploy
            sudo -n tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx >/dev/null <<'HOOK'
          #!/bin/sh
          systemctl reload nginx
          HOOK
            sudo -n chmod 755 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
            sudo -n tee /etc/systemd/system/beihuochuhuojihua-certbot-renew.service >/dev/null <<'SERVICE'
          [Unit]
          Description=Renew Let's Encrypt certificates for beihuochuhuojihua

          [Service]
          Type=oneshot
          ExecStart=/snap/bin/certbot renew --quiet
          SERVICE
            sudo -n tee /etc/systemd/system/beihuochuhuojihua-certbot-renew.timer >/dev/null <<'TIMER'
          [Unit]
          Description=Renew beihuochuhuojihua HTTPS certificate twice daily

          [Timer]
          OnCalendar=*-*-* 00,12:15:00
          RandomizedDelaySec=3600
          Persistent=true

          [Install]
          WantedBy=timers.target
          TIMER
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now beihuochuhuojihua-certbot-renew.timer

            if command -v ufw >/dev/null 2>&1 && sudo -n ufw status | grep -q '^Status: active'; then
              sudo -n ufw allow 443/tcp
            fi

            curl -fsS -H 'Host: 129.211.9.242' http://127.0.0.1/ >/dev/null
            curl -kfsS -H 'Host: 129.211.9.242' https://127.0.0.1/beihuochuhuojihua-api/api/bootstrap >/dev/null
            curl -kfsS -H 'Host: 129.211.9.242' https://127.0.0.1/beihuochuhuojihua/ >/dev/null
            sudo -n systemctl is-enabled beihuochuhuojihua-certbot-renew.timer
            sudo -n systemctl is-active beihuochuhuojihua-certbot-renew.timer
            rm -f "$ARCHIVE"
          EOF

      - name: Verify public HTTPS
        run: |
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error --location \
            https://129.211.9.242/beihuochuhuojihua-api/api/bootstrap >/dev/null
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error --location \
            https://129.211.9.242/beihuochuhuojihua/ >/dev/null
