name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beihuochuhuojihua
        uses: actions/checkout@v4
        with:
          repository: sunlizhu521-alt/beihuochuhuojihua
          ref: main

      - name: Package source
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='data' \
            --exclude='dist' \
            -czf "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" .

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload package
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /home/ubuntu/zhuge-ai-lab/beihuochuhuojihua /tmp/beihuochuhuojihua-deploy"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/beihuochuhuojihua.tar.gz" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz

      - name: Deploy and verify
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -Eeuo pipefail

            APP_DIR=/home/ubuntu/zhuge-ai-lab/beihuochuhuojihua
            ARCHIVE=/tmp/beihuochuhuojihua-deploy/beihuochuhuojihua.tar.gz
            BACKUP_DIR=/home/ubuntu/backups/beihuochuhuojihua
            APP_NAME=beihuochuhuojihua
            APP_PORT=

            mkdir -p "$APP_DIR" "$BACKUP_DIR"

            for CANDIDATE_PORT in 4008 4009 4010 4011 4012 4013 4014 4015; do
              if ! lsof -t -iTCP:"$CANDIDATE_PORT" -sTCP:LISTEN >/dev/null 2>&1; then
                APP_PORT="$CANDIDATE_PORT"
                break
              fi
            done
            if [ -z "$APP_PORT" ]; then
              echo "No free application port is available in the approved range."
              exit 1
            fi
            echo "Selected application port: $APP_PORT"

            if [ -s "$APP_DIR/data/gendanjindu.sqlite" ]; then
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="$BACKUP_DIR/gendanjindu-$TIMESTAMP.sqlite.gz"
              gzip -c "$APP_DIR/data/gendanjindu.sqlite" > "$BACKUP_FILE.tmp"
              gzip -t "$BACKUP_FILE.tmp"
              mv "$BACKUP_FILE.tmp" "$BACKUP_FILE"
              ls -lh "$BACKUP_FILE"
            fi

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            cd "$APP_DIR"
            npm ci
            npm run build

            export PORT="$APP_PORT"
            export DATA_DIR="$APP_DIR/data"
            pm2 startOrRestart ecosystem.config.cjs --only "$APP_NAME" --update-env

            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$APP_PORT/api/bootstrap" >/dev/null \
                && curl -fsS "http://127.0.0.1:$APP_PORT/beihuochuhuojihua/" >/dev/null; then
                break
              fi
              if [ "$attempt" = 30 ]; then
                pm2 logs "$APP_NAME" --lines 100 --nostream
                exit 1
              fi
              sleep 2
            done

            pm2 save
            pm2 describe "$APP_NAME"
            if sudo -n true >/dev/null 2>&1; then
              echo "NGINX_ROUTE_SUMMARY_BEGIN"
              sudo -n nginx -T 2>/dev/null | grep -E 'listen |server_name|location /|proxy_pass' || true
              echo "NGINX_ROUTE_SUMMARY_END"
            else
              echo "Passwordless sudo is not available for Nginx configuration."
            fi
            rm -f "$ARCHIVE"
          EOF
