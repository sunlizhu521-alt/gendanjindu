name: Diagnose Kingdee Upload

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Collect recent upload errors
        run: |
          mkdir -p ~/.ssh diagnostics
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "tail -n 600 ~/.pm2/logs/gendanjindu-error.log 2>/dev/null || true" \
            > diagnostics/gendanjindu-error.log

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: kingdee-upload-diagnostic
          path: diagnostics/gendanjindu-error.log
          retention-days: 1
